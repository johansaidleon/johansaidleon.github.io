<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'; upgrade-insecure-requests; script-src 'self' 'sha256-D49GI8bJWeFz2BXz2z68Cs8kVDtRm6TyOjOZlEN+3MI='; img-src 'self' data: blob:; font-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: data:; worker-src 'self' blob:; manifest-src 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pasapáginas</title>
  <meta name="description" content="Convierte un PDF en un libro con páginas que se voltean. Funciona sin internet.">
  <meta name="theme-color" content="#0B0B0D" id="theme-color">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pasapáginas">
  <script>
    // Mismo tema que el portafolio (comparten la clave "theme"): oscuro por defecto.
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      if (t === 'light') document.getElementById('theme-color').setAttribute('content', '#F8F4EC');
    } catch (e) {}
  </script>
  <link rel="preload" href="fonts/cormorant-garamond-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand">
      <h1>Pasa<em>páginas</em></h1>
      <p>Convierte un PDF en un libro con páginas que se voltean. El archivo se queda en tu dispositivo.</p>
    </div>
    <div class="actions">
      <span class="meta" id="meta"></span>
      <a class="btn ghost back" href="../">&larr; Portafolio</a>
      <button class="btn" id="install" type="button" hidden>Instalar app</button>
      <a class="btn ghost" href="ayuda.html">Ayuda</a>
      <button class="btn icon" id="theme" type="button" aria-label="Cambiar entre tema claro y oscuro" title="Tema claro / oscuro"><span class="half" aria-hidden="true"></span></button>
      <button class="btn" id="close-book" type="button" hidden>Cerrar libro</button>
      <button class="btn primary" id="open" type="button">Abrir PDF</button>
      <input id="pdf-input" type="file" accept="application/pdf,.pdf" hidden>
    </div>
  </header>

  <p id="msg" role="status"></p>

  <main class="stage" id="stage">
    <div id="bookwrap"></div>
    <div class="busy" id="busy" hidden>
      <div class="busy-box">
        <p id="busy-text">Preparando páginas</p>
        <div class="bar"><i id="busy-bar"></i></div>
      </div>
    </div>
  </main>

  <footer>
    <button class="btn icon" id="prev" type="button" aria-label="Página anterior">&#8592;</button>
    <span class="counter" id="counter" aria-live="polite">—</span>
    <button class="btn icon" id="next" type="button" aria-label="Página siguiente">&#8594;</button>
    <input id="jump" type="range" min="1" max="1" value="1" aria-label="Ir a la página">
    <button class="btn icon hd" id="hd" type="button" aria-pressed="false" aria-label="Máxima nitidez" title="Máxima nitidez: más detalle, tarda más y usa más memoria">HD</button>
    <button class="btn icon" id="full" type="button" aria-label="Pantalla completa" title="Pantalla completa">&#9974;</button>
  </footer>

  <div class="drop" id="drop" hidden><div>Suelta el PDF para abrirlo</div></div>

  <script src="vendor/pdf.min.js"></script>
  <script src="vendor/page-flip.browser.js"></script>
  <script src="app.js"></script>
</body>
</html>
